# Disable anonymous logins (forces password or token authentication)
listener 1883 0.0.0.0
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

# Standard unencrypted MQTT listener (for local testing/internal networks)
# listener 1883

# Save active sessions, retained messages, and subscriptions to disk
persistence true
persistence_location /mosquitto/data/

# Logging configuration
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# User credential file
password_file /mosquitto/config/passwords