events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimize file transfer
    sendfile on;
    keepalive_timeout 65;

    # HTTP Server: Handles Let's Encrypt validation & redirects everything else to HTTPS
    server {
        listen 80;
        server_name kronoscast.com www.kronoscast.com;

        # Allow Certbot to write its ACME challenge files over HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Public API Gateway
    server {
        listen 443 ssl;
        server_name kronoscast.com www.kronoscast.com;

        # SSL Certificates managed by Certbot (mapped via Docker volumes)
        ssl_certificate /etc/letsencrypt/live/kronoscast.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kronoscast.com/privkey.pem;

        # Modern SSL Security Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

        # Proxy requests to your Node.js backend container
        location / {
            proxy_pass http://node_app:3000;
            proxy_http_version 1.1;

            # Essential headers for mobile app API requests

	    	# original domain name requested by the client
            proxy_set_header Host $host; 

	    	# public IP of the client
            proxy_set_header X-Real-IP $remote_addr; 

	    	# comma separated list of all IP addresses passed from client to server
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 

	    	# protocol of original client request
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Optional: Increase timeout limits if mobile app uploads larger payloads (like images)
            proxy_read_timeout 90s;
        }

		location /mqtt {
	   		proxy_pass http://mosquitto:9001;
			proxy_http_version 1.1;
	
		    # Upgrade HTTP to WSebSocket connection
		    proxy_set_header Upgrade $http_upgrade;
		    proxy_set_header Connection "upgrade";
	
	        # Essential headers for mobile app API requests
	        proxy_set_header Host $host;
	        proxy_set_header X-Real-IP $remote_addr;
	        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;
            
		    # Timeout settings so persistend MQTT connections don't drop prematurely
	        proxy_read_timeout 86400s;
	        proxy_send_timeout 86400s;
		}
    }

    server {
        listen 443 ssl;
        server_name edge.kronoscast.com;

        ssl_certificate /etc/letsencrypt/live/edge.kronoscast.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/edge.kronoscast.com/privkey.pem;

        location / {
            proxy_pass http://headscale:8080;
            proxy_http_version 1.1;
            
            # Essential headers for WebSocket support (Tailscale control plane uses WebSockets)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
