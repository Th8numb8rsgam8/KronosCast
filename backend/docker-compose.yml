services:
  init-dynsec:
    image: eclipse-mosquitto:2
    container_name: init_dynsec
    environment:
      - MQTT_ADMIN_USER=${MQTT_ADMIN_USER:-admin}
      - MQTT_ADMIN_PASS=${MQTT_ADMIN_PASS}
    volumes:
      # Bind mount directly to local ./config folder on host
      - ./eclipse-mosquitto/config:/mosquitto/config
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /mosquitto/config/dynamic-security.json ]; then
        echo 'Generating dynamic-security.json...';
        mosquitto_ctrl dynsec init /mosquitto/config/dynamic-security.json \$MQTT_ADMIN_USER \$MQTT_ADMIN_PASS;
        chmod 644 /mosquitto/config/dynamic-security.json;
      else
        echo 'dynamic-security.json already exists. Skipping.';
      fi
      "

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_broker
    restart: unless-stopped
    depends_on:
      init-dynsec:
        condition: service_completed_successfully
    ports:
      - "1883:1883"   # Standard MQTT Port
      - "8883:8883"   # MQTT over TLS/SSL (For production deployment)
    volumes:
      # Bind mounts to host directories
      - ./eclipse-mosquitto/config:/mosquitto/config
      - ./eclipse-mosquitto/data:/mosquitto/data
      - ./eclipse-mosquitto/log:/mosquitto/log

