services:
  init-dynsec:
    image: eclipse-mosquitto:2
    container_name: init_dynsec
    environment:
      - MQTT_ADMIN_USER=${MQTT_ADMIN_USER:-admin}
      - MQTT_ADMIN_PASS=${MQTT_ADMIN_PASS}
    volumes:
      # Bind mount directly to local ./config folder on host
      - ./eclipse-mosquitto/config:/mosquitto/config
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /mosquitto/config/dynamic-security.json ]; then
        echo 'Generating dynamic-security.json...';
        mosquitto_ctrl dynsec init /mosquitto/config/dynamic-security.json \$MQTT_ADMIN_USER \$MQTT_ADMIN_PASS;
        chmod 644 /mosquitto/config/dynamic-security.json;
      else
        echo 'dynamic-security.json already exists. Skipping.';
      fi
      "

  cfssl:
    image: cfssl/cfssl:latest
    container_name: cfssl_ca
    entrypoint: >
      /bin/sh -c "
        if [ ! -f /etc/cfssl/ca-key.pem ]; then
          echo 'Initializing fresh production Certificate Authority...';
          cfssl gencert -initca /etc/cfssl/ca-csr.json | cfssljson -bare /etc/cfssl/ca;
          cp /etc/cfssl/ca.pem /etc/cfssl-public/ca.pem;
        fi;
        echo 'Starting CFSSL Signing Server...';
        cfssl serve -address=0.0.0.0 -port=8888 -ca=/etc/cfssl/ca.pem -ca-key=/etc/cfssl/ca-key.pem -config=/etc/cfssl/ca-config.json
      "
    networks:
      - iot_production_network
    ports:
      - "8888:8888"
    volumes:
      - ./cfssl/cfssl-config:/etc/cfssl
      - ./cfssl/cfssl-public:/etc/cfssl-public
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_broker
    depends_on:
      init-dynsec:
        condition: service_completed_successfully
      cfssl:
        condition: service_started
    ports:
      - "1883:1883"   # Standard MQTT Port
      - "8883:8883"   # MQTTS over mTLS (Edge Devices)
      - "9001:9001"
    networks:
      - iot_production_network
    volumes:
      # Bind mounts to host directories
      - ./eclipse-mosquitto/config:/mosquitto/config
      - ./eclipse-mosquitto/data:/mosquitto/data
      - ./eclipse-mosquitto/log:/mosquitto/log
      - ./certbot-certs/server.crt:/mosquitto/config/certs/server.crt:ro
      - ./certbot-certs/server.key:/mosquitto/config/certs/server.key:ro
      - ./cfssl/cfssl-public:/mosquitto/config/certs/ca_authority:ro
    restart: unless-stopped

