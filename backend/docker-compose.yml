services:
  init-dynsec:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: init_dynsec
    environment:
      - MQTT_ADMIN_USER=${MQTT_ADMIN_USER:-admin}
      - MQTT_ADMIN_PASS=${MQTT_ADMIN_PASS}
    volumes:
      # Bind mount directly to local ./config folder on host
      - ./eclipse-mosquitto/config:/mosquitto/config
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /mosquitto/config/dynamic-security.json ]; then
        echo 'Generating dynamic-security.json...';
        mosquitto_ctrl dynsec init /mosquitto/config/dynamic-security.json \$MQTT_ADMIN_USER \$MQTT_ADMIN_PASS;
      else
        echo 'dynamic-security.json already exists. Skipping.';
      fi;
      chown -R 1883:1883 /mosquitto/config;
      chmod 775 /mosquitto/config;
      chmod 664 /mosquitto/config/dynamic-security.json;
      "

  # cfssl:
  #   image: cfssl/cfssl:v1.7.1
  #   container_name: cfssl_ca
  #   entrypoint: >
  #     /bin/sh -c "
  #       if [ ! -f /etc/cfssl/ca-key.pem ]; then
  #         echo 'Initializing fresh production Certificate Authority...';
  #         cfssl gencert -initca /etc/cfssl/ca-csr.json | cfssljson -bare /etc/cfssl/ca;
  #         cp /etc/cfssl/ca.pem /etc/cfssl-public/ca.pem;
  #       fi;
  #       echo 'Starting CFSSL Signing Server...';
  #       cfssl serve -address=0.0.0.0 -port=8888 -ca=/etc/cfssl/ca.pem -ca-key=/etc/cfssl/ca-key.pem -config=/etc/cfssl/ca-config.json
  #     "
  #   networks:
  #     - iot_production_network
  #   # ports:
  #   #   - "8888:8888"
  #   volumes:
  #     - ./cfssl/cfssl-config:/etc/cfssl
  #     - ./cfssl/cfssl-public:/etc/cfssl-public
  #   restart: unless-stopped

  certbot-init:
    image: certbot/certbot:nightly
    container_name: certbot_init
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    ports:
      - "80:80"
    # This command only runs if the live folder doesn't exist yet, then exits cleanly
    entrypoint: >
      /bin/sh -c "
        echo 'Checking SSL certificate status...';
        certbot certonly --standalone -d kronoscast.com -d edge.kronoscast.com --register-unsafely-without-email --agree-tos --non-interactive --keep-until-expiring;
        chmod -R 755 /etc/letsencrypt/live;
        chmod -R 755 /etc/letsencrypt/archive;
        exit 0
      "

  certbot:
    image: certbot/certbot:nightly
    container_name: certbot_renewer
    restart: unless-stopped
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12d & wait $${!}; done;'"
    networks:
      - iot_production_network

  api-gateway:
    image: nginx:1.31.8-trixie
    container_name: nginx_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    networks:
      - iot_production_network
    depends_on:
      certbot-init:
        condition: service_completed_successfully

  headscale:
    image: headscale/headscale:main-5651bf4
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./headscale/config:/etc/headscale
      - headscale-data:/var/lib/headscale
    ports:
      - "127.0.0.1:8080:8080"
      - "3478:3478/udp"
    networks:
      - iot_production_network

  node-tailscale: 
    image: tailscale/tailscale:latest
    container_name: node_tailscale
    restart: unless-stopped
    environment:
      - TS_HOSTNAME=${HEADSCALE_NODE_HOSTNAME}
      - TS_AUTHKEY=${HEADSCALE_NODE_PREAUTH_KEY}
      - TS_EXTRA_ARGS=--login-server=${HEADSCALE_SUBDOMAIN}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=0
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - node-ts-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    network_mode: "container:node_backend"
    depends_on:
      - node_app
      - headscale
      - api-gateway

  mosquitto-tailscale: 
    image: tailscale/tailscale:latest
    container_name: mosquitto_tailscale
    restart: unless-stopped
    environment:
      - TS_HOSTNAME=${HEADSCALE_MOSQUITTO_HOSTNAME}
      - TS_AUTHKEY=${HEADSCALE_MOSQUITTO_PREAUTH_KEY}
      - TS_EXTRA_ARGS=--login-server=${HEADSCALE_SUBDOMAIN}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=0
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - mosquitto-ts-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    network_mode: "container:mosquitto_broker"
    depends_on:
      - mosquitto
      - headscale
      - api-gateway

  admin-tailscale:
    image: tailscale/tailscale:latest
    container_name: admin_tailscale
    restart: unless-stopped
    hostname: droplet-gateway
    network_mode: host
    environment:
      - TS_AUTHKEY=${HEADSCALE_ADMIN_PREAUTH_KEY}
      - TS_EXTRA_ARGS=--login-server=${HEADSCALE_SUBDOMAIN}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=0
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # networks:
    #   - iot_production_network
    volumes:
      - tailscale-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - headscale
      - api-gateway

  init-mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto_init
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    command: >
      sh -c "
        chown -R 1883:1883 /mosquitto/data /mosquitto/log &&
        chmod 755 /mosquitto/data &&
        chmod 775 /mosquitto/log
      "

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto_broker
    depends_on:
      init-dynsec:
        condition: service_completed_successfully
      init-mosquitto:
        condition: service_completed_successfully
      certbot-init:
        condition: service_completed_successfully
      # cfssl:
      #   condition: service_started
    # ports:
      # - "1883:1883"   # Standard MQTT Port for NodeJS Admin User
      # - "8883:8883"   # MQTTS over mTLS (Edge Devices)
      # - "9001:9001"   # Websockets Connection for Mobile App
    networks:
      - iot_production_network
    volumes:
      # Bind mounts to host directories
      - ./eclipse-mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      # - ./certbot-certs/server.crt:/mosquitto/config/certs/server.crt:ro
      # - ./certbot-certs/server.key:/mosquitto/config/certs/server.key:ro
      - certbot-etc:/etc/letsencrypt:ro
      # - ./cfssl/cfssl-public:/mosquitto/config/certs/ca_authority:ro
    restart: unless-stopped

  node_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node_backend
    restart: unless-stopped
    # ports:
      # - "80:80"
      # - "8443:8443"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - iot_production_network
    volumes:
      # - ./cfssl/cfssl-public:/app/cfssl-config:ro
      # - ./certbot-certs/server.crt:/certs/server.crt:ro
      # - ./certbot-certs/server.key:/certs/server.key:ro
      - certbot-etc:/etc/letsencrypt:ro
      - ./public_key.pem:/app/public_key.pem
    depends_on:
      # cfssl:
      #   condition: service_started
      postgres:
        condition: service_started
      certbot-init:
        condition: service_completed_successfully

  postgres:
      image: postgres:16-alpine
      container_name: postgres_db
      restart: unless-stopped
      environment:
        - POSTGRES_USER=${DB_USER:-postgres}
        - POSTGRES_PASSWORD=${DB_PASSWORD:-secretpassword}
        - POSTGRES_DB=${DB_NAME:-iot_production}
      # ports:
      #   - "5432:5432"
      networks:
        - iot_production_network
      volumes:
        - postgres-data:/var/lib/postgresql/data

networks:
  iot_production_network:
    driver: bridge

volumes:
  certbot-etc:    # Shared public server certificates
  certbot-var:    # Shared webroot validation challenge path
  # cfssl-certs:    # Shared private root CA file (ca.pem)
  postgres-data:
  mosquitto-data:
  mosquitto-log:
  headscale-data:
  tailscale-data:
  node-ts-state:
  mosquitto-ts-state:
