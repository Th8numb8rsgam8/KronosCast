# Disable anonymous logins (forces password or token authentication)
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

# Save active sessions, retained messages, and subscriptions to disk
persistence true
persistence_location /mosquitto/data/

# -----------------------------------------------------------------
# 1. Unencrypted Internal TCP Listener (Express Backend inside Docker)
# -----------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# -----------------------------------------------------------------
# 2. Encrypted MQTTS Listener (Mobile Apps on Port 8883)
# -----------------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
# Requires clients to present valid username/password (via Dynamic Security)
require_certificate false
# Set to 'true' ONLY if using mutual TLS (mTLS) with client certificates

# -----------------------------------------------------------------
# 2. WebSockets MQTTS (Port 9001 for Mobile & Web)
# -----------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# Logging configuration
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# User credential file
# password_file /mosquitto/config/passwords