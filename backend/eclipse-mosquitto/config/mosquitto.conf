# Disable anonymous logins (forces password or token authentication)
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

# Save active sessions, retained messages, and subscriptions to disk
persistence true
persistence_location /mosquitto/data/

# -----------------------------------------------------------------
# 1. Unencrypted Internal TCP Listener (Express Backend inside Docker)
# -----------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# -----------------------------------------------------------------
# 2. Encrypted MQTTS Edge Device Listener (Enforced mTLS)
# -----------------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Demand & verify client certs from the edge device
cafile /mosquitto/config/certs/ca_authority/ca.pem
require_certificate true

# Automatically use the Common Name (Serial Number) from the client.crt as the MQTT username
use_identity_as_username true

# -----------------------------------------------------------------
# 4. WebSockets MQTTS (Port 9001 for Mobile & Web)
# -----------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# Logging configuration
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# User credential file
# password_file /mosquitto/config/passwords